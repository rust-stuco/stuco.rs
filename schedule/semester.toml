# Current semester schedule. Edited once per semester by that term's instructors.
#
# Each entry unlocks a content week's slides and homework at `reveal_time` on its date; no code
# change or redeploy is needed. Reorder or drop weeks by editing this list; each `week` is the file
# stem of a content file under `schedule/weeks/`. Visitors can reveal upcoming weeks early with the
# "Show upcoming content" toggle, where they are marked subject to change.
#
# Dates follow the CMU academic calendar:
# https://www.cmu.edu/hub/calendar/docs/2627-academic-calendar.pdf

name = "Fall 2026"
