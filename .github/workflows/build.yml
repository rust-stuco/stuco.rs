name: Deploy website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Taplo
        uses: taiki-e/install-action@v2
        with:
          tool: taplo
          fallback: none

      - name: Validate TOML formatting
        run: taplo fmt --check resources/*.toml schedule/*.toml schedule/weeks/*.toml Cargo.toml

      - name: Validate TOML against schemas
        run: taplo check

  slidev-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: slidev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: slidev/package-lock.json

      - name: Install Slidev
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: npm ci --no-audit --no-fund

      # This deck uses shared and lecture-local images, exercising both Windows workspace links.
      - name: Build a representative lecture deck
        run: |
          npm run build -- 14_concurrency
          if ($LASTEXITCODE -ne 0) {
            throw "Slidev failed to build 14_concurrency"
          }

          $index = "dist/14_concurrency/deck/index.html"
          if (-not (Test-Path $index -PathType Leaf)) {
            throw "Slidev did not create $index"
          }

  build:
    needs: [validate, slidev-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to post the preview link on the pull request.
      pull-requests: write
    env:
      SITE_URL: >-
        ${{
          github.event_name == 'pull_request' &&
          format(
            'https://pr-{0}-stuco-rs.rust-stuco.workers.dev',
            github.event.pull_request.number
          ) ||
          'https://stuco.rs'
        }}
    environment:
      name: ${{ github.event_name == 'pull_request' && format('preview-pr-{0}', github.event.pull_request.number) || 'production' }}
      # The production hostname is a Cloudflare custom domain rather than a Wrangler-managed target,
      # so `wrangler deploy` reports no deployment URL to borrow here and the link would be empty.
      url: >-
        ${{
          github.event_name == 'pull_request' &&
          format(
            'https://pr-{0}-stuco-rs.rust-stuco.workers.dev',
            github.event.pull_request.number
          ) ||
          'https://stuco.rs'
        }}
      deployment: >-
        ${{
          github.ref == 'refs/heads/main' ||
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository
          )
        }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: slidev/package-lock.json

      # Point Slidev at the runner's browser so it does not download another copy for PDF export.
      - name: Locate the browser for slide export
        run: |
          echo "STUCO_SLIDEV_CHROME=$(command -v google-chrome || command -v chromium)" \
            >> "$GITHUB_ENV"

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      # Needed for wasm-opt
      - name: Install binaryen
        uses: sigoden/install-binary@v1
        with:
          repo: WebAssembly/binaryen
          name: wasm-opt

      # Needed to compile the syllabus
      - name: Install typst
        uses: typst-community/setup-typst@v4

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
            !target/dx/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Dioxus CLI
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.2

      # Catches schedule misconfiguration, which would otherwise only panic in the browser.
      - name: Run tests
        env:
          STUCO_SKIP_LECTURES: 1
        run: cargo test --locked

      - name: Build
        run: dx build --release

      # The decks are pre-built single-page apps, so they are built outside `public/`: `dx` re-bundles
      # every JavaScript file it finds there, which does not survive Slidev's module graph. Overlay
      # them onto the bundle that `wrangler` uploads instead.
      - name: Validate and add the Slidev decks to the bundle
        run: |
          test "$(find target/slidev/lectures -path '*/deck/index.html' -type f -size +0c | wc -l)" -eq 14
          test "$(find public/lectures -type f \( -name '*-light.pdf' -o -name '*-dark.pdf' \) -size +0c | wc -l)" -eq 28
          mkdir -p target/dx/stuco-rs/release/web/public/lectures
          cp -r target/slidev/lectures/. target/dx/stuco-rs/release/web/public/lectures/
          test "$(find target/dx/stuco-rs/release/web/public/lectures -path '*/deck/index.html' -type f -size +0c | wc -l)" -eq 14
          test "$(find target/dx/stuco-rs/release/web/public/lectures -type f \( -name '*-light.pdf' -o -name '*-dark.pdf' \) -size +0c | wc -l)" -eq 28

      - name: Upload syllabus artifact
        uses: actions/upload-artifact@v4
        with:
          name: syllabus
          path: target/dx/stuco-rs/release/web/public/syllabus.pdf

      - name: Deploy production website
        id: production
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy

      - name: Deploy preview website
        id: preview
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }}

      # Routes fall back to the single-page application shell, so a missing file is served as HTML
      # with a 200 status. Compare content types against the build output to catch that.
      - name: Smoke-test the deployed site
        if: ${{ steps.production.outcome == 'success' || steps.preview.outcome == 'success' }}
        run: |
          root=target/dx/stuco-rs/release/web/public
          failed=0

          check() {
            local path=$1 expected=$2 actual
            actual=$(curl -sSI --max-time 30 "$SITE_URL$path" |
              tr -d '\r' | awk -F': ' 'tolower($1) == "content-type" { print $2 }')
            case $actual in
              "$expected"*) ;;
              *) echo "::error::$path served as '${actual:-nothing}', expected $expected"; failed=1 ;;
            esac
          }

          while IFS= read -r file; do
            case $file in
              *.pdf) check "${file#"$root"}" application/pdf ;;
              *.zip) check "${file#"$root"}" application/zip ;;
            esac
          done < <(find "$root" -type f \( -name '*.pdf' -o -name '*.zip' \) | sort)

          check / text/html
          check /schedule text/html

          if [ "$failed" -ne 0 ]; then
            echo "::error::$SITE_URL is missing generated content"
            exit 1
          fi

      # A single edited comment keeps the current link in one place, rather than appending a
      # deployment entry to the pull request timeline on every push.
      - name: Comment the preview link
        if: ${{ steps.preview.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- preview-link -->'
          body=$(printf '%s\n**Preview:** %s\n\nBuilt from `%s`.\n' "$marker" "$SITE_URL" "${SHA:0:7}")

          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq "map(select(.body | startswith(\"$marker\"))) | first | .id // empty")

          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body"
          fi
